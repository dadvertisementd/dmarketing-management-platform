name: Build cPanel release package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl, pdo_sqlite, sqlite3, fileinfo, gd, zip
          coverage: none

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel test environment
        working-directory: backend
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          (Get-Content .env) `
            -replace '^APP_ENV=.*', 'APP_ENV=testing' `
            -replace '^APP_DEBUG=.*', 'APP_DEBUG=true' `
            -replace '^DB_CONNECTION=.*', 'DB_CONNECTION=sqlite' `
            -replace '^DB_DATABASE=.*', 'DB_DATABASE=database/database.sqlite' `
            -replace '^SESSION_DRIVER=.*', 'SESSION_DRIVER=array' `
            -replace '^CACHE_STORE=.*', 'CACHE_STORE=array' `
            -replace '^QUEUE_CONNECTION=.*', 'QUEUE_CONNECTION=sync' |
            Set-Content .env
          php artisan key:generate
          New-Item -ItemType File -Force database/database.sqlite | Out-Null
          php artisan migrate --force

      - name: Run Laravel tests
        working-directory: backend
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run lint

      - name: Build frontend assets
        run: npm run build

      - name: Copy frontend assets into Laravel public
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "dist/index.html" -Destination "backend/public/index.html" -Force
          New-Item -ItemType Directory -Force -Path "backend/public/assets" | Out-Null
          Copy-Item -Path "dist/assets/*" -Destination "backend/public/assets" -Force

      - name: Mirror Laravel app for cPanel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "deployment" | Out-Null
          foreach ($path in @("deployment/dmarketing-app", "deployment/public_html", "deployment/dmarketing-deploy.zip")) {
            if (Test-Path $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          robocopy "backend" "deployment/dmarketing-app" /MIR /XD vendor node_modules storage\app\private storage\framework\cache\data storage\framework\sessions storage\framework\views storage\logs /XF .env database.sqlite .phpunit.result.cache
          if ($LASTEXITCODE -gt 7) {
            throw "robocopy failed while copying Laravel app."
          }
          $global:LASTEXITCODE = 0

      - name: Install production Composer dependencies
        working-directory: deployment/dmarketing-app
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Create cPanel public_html folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "deployment/public_html" | Out-Null
          Copy-Item -LiteralPath "deployment/dmarketing-app/public/*" -Destination "deployment/public_html" -Recurse -Force
          $indexPhp = @'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          if (file_exists($maintenance = __DIR__.'/../dmarketing-app/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          require __DIR__.'/../dmarketing-app/vendor/autoload.php';

          /** @var Application $app */
          $app = require_once __DIR__.'/../dmarketing-app/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          '@
          Set-Content -LiteralPath "deployment/public_html/index.php" -Value $indexPhp -Encoding ASCII

      - name: Build deployment ZIP
        shell: pwsh
        run: Compress-Archive -Path "deployment/dmarketing-app", "deployment/public_html" -DestinationPath "deployment/dmarketing-deploy.zip" -Force

      - name: Upload deployment ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dmarketing-cpanel-release
          path: deployment/dmarketing-deploy.zip
          if-no-files-found: error
